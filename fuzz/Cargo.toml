[package]
name = "font-shape-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.font-shape]
path = ".."

# The fuzz target builds font outlines to rasterize, so it needs the model
# directly as well as through font-shape.
[dependencies.font-model]
version = "0.1"

[[bin]]
name = "font_shape_fuzz"
path = "fuzz_targets/font_shape_fuzz.rs"
test = false
doc = false
bench = false